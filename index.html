<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adda247 Lead Priority Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--red:#e31e24;--black:#101114;--muted:#6b7280;--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--green:#16a34a;--amber:#f59e0b;--blue:#2563eb}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--black)}
    .top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#0d0d0f,#27272a);color:#fff;padding:18px 24px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
    .brand{display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-weight:900;font-size:28px;color:#fff}.logo span{color:var(--red)}
    .sub{color:#d1d5db;font-size:13px;margin-top:4px}.tabs{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
    .tab{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:700}.tab.active{background:var(--red);border-color:var(--red)}
    .wrap{padding:22px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 25px rgba(15,23,42,.06)}
    .kpi .label{color:var(--muted);font-size:13px}.kpi .value{font-size:28px;font-weight:900;margin-top:8px}.kpi .hint{font-size:12px;color:var(--muted);margin-top:4px}
    .section{margin-top:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.three{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
    h2{font-size:18px;margin:0 0 14px}.filters{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:12px;margin-bottom:14px}
    input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none} input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(227,30,36,.12)}
    .btn{background:var(--black);color:#fff;border:none;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:800}.btn.red{background:var(--red)}.btn.light{background:#fff;color:#111;border:1px solid var(--line)}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px} th{position:sticky;top:95px;background:#fafafa;text-align:left;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap} td{padding:11px 12px;border-bottom:1px solid #f0f0f0;vertical-align:top} tr:hover{background:#fff7f7}
    .tablebox{max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:16px}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-weight:800;font-size:12px;white-space:nowrap}.hot{background:#fee2e2;color:#b91c1c}.warm{background:#fef3c7;color:#92400e}.follow{background:#dbeafe;color:#1d4ed8}.cold{background:#e5e7eb;color:#374151}.not{background:#f3f4f6;color:#111827}
    .insight{line-height:1.55;color:#374151}.loader{padding:40px;text-align:center;color:#666}.hide{display:none}.small{font-size:12px;color:var(--muted)}
    @media(max-width:1100px){.grid,.two,.three,.filters{grid-template-columns:1fr 1fr}} @media(max-width:700px){.grid,.two,.three,.filters{grid-template-columns:1fr}.wrap{padding:14px} th{top:140px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><div><div class="logo">adda<span>247</span></div><div class="sub">WhatsApp Campaign Response Intelligence Dashboard</div></div><button class="btn red" onclick="downloadFilteredCSV()">Download Filtered CSV</button></div>
    <div class="tabs"><button class="tab active" onclick="showPage('dashboard',this)">Main Dashboard</button><button class="tab" onclick="showPage('leads',this)">Interested Leads Filter Page</button></div>
  </header>
  <main class="wrap">
    <div id="loading" class="loader card">Loading lead data from <b>data/leads.csv</b>...</div>
    <section id="dashboard" class="hide">
      <div class="grid" id="kpis"></div>
      <div class="two section"><div class="card"><h2>Priority Distribution</h2><canvas id="priorityChart"></canvas></div><div class="card"><h2>Campaign-wise Response Analysis</h2><canvas id="campaignChart"></canvas></div></div>
      <div class="three section"><div class="card"><h2>Top Hot Leads to Call First</h2><div class="tablebox"><table id="topHotTable"></table></div></div><div class="card"><h2>Summary Insights & Actions</h2><div class="insight" id="insights"></div></div></div>
    </section>
    <section id="leads" class="hide">
      <div class="card"><h2>Interested Candidates Filter Page</h2><div class="filters">
        <input id="q" placeholder="Search phone/comment/reason" oninput="applyFilters()" />
        <select id="priority" onchange="applyFilters()"><option value="">All Priorities</option></select>
        <select id="campaign" onchange="applyFilters()"><option value="">All Campaigns</option></select>
        <select id="category" onchange="applyFilters()"><option value="">All Categories</option></select>
        <input id="from" type="date" onchange="applyFilters()" />
        <input id="to" type="date" onchange="applyFilters()" />
        <select id="signal" onchange="applyFilters()"><option value="">All Buying Signals</option><option>price</option><option>discount</option><option>fees</option><option>admission</option><option>join</option><option>buy</option><option>call</option><option>demo</option><option>payment</option><option>emi</option></select>
        <input id="minScore" type="number" placeholder="Min score" oninput="applyFilters()" />
        <select id="rows" onchange="renderTable()"><option value="100">Show 100</option><option value="500">Show 500</option><option value="1000">Show 1000</option><option value="5000">Show 5000</option></select>
        <button class="btn light" onclick="resetFilters()">Reset</button><button class="btn red" onclick="downloadFilteredCSV()">Download</button>
      </div><div class="small" id="resultText"></div></div>
      <div class="card section"><div class="tablebox"><table id="leadTable"></table></div></div>
    </section>
  </main>
<script>
let DATA=[], filtered=[], sortKey='score', sortDir=-1, charts=[];
const cols=['priority','score','phone','campaign','category','owner_number','last_date','response_count','latest_comment','reason'];
function parseCSV(text){let rows=[], row=[], val='', q=false; for(let i=0;i<text.length;i++){let c=text[i], n=text[i+1]; if(q){if(c=='"'&&n=='"'){val+='"';i++}else if(c=='"')q=false;else val+=c}else{if(c=='"')q=true;else if(c==','){row.push(val);val=''}else if(c=='\n'){row.push(val);rows.push(row);row=[];val=''}else if(c!='\r')val+=c}} if(val||row.length){row.push(val);rows.push(row)} const head=rows.shift().map(h=>h.replace(/^\uFEFF/,'')); return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])))}
function num(x){return +String(x||0).replace(/[^0-9.-]/g,'')||0} function fmt(n){return Number(n).toLocaleString('en-IN')} function group(key, arr=DATA){return arr.reduce((a,r)=>{let k=r[key]||'Unknown';a[k]=(a[k]||0)+1;return a},{})}
function badge(p){let c=p.includes('Hot')?'hot':p.includes('Warm')?'warm':p.includes('Follow')?'follow':p.includes('Not')?'not':'cold';return `<span class="badge ${c}">${p}</span>`}
function showPage(id,el){document.querySelectorAll('main section').forEach(s=>s.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active')}
function fillSelect(id, values){let s=document.getElementById(id); values.sort().forEach(v=>{if(v){let o=document.createElement('option');o.value=o.textContent=v;s.appendChild(o)}})}
function init(){DATA.forEach(r=>{r.score=num(r.score);r.response_count=num(r.response_count)}); filtered=DATA.slice(); fillSelect('priority',[...new Set(DATA.map(r=>r.priority))]); fillSelect('campaign',[...new Set(DATA.map(r=>r.campaign))]); fillSelect('category',[...new Set(DATA.map(r=>r.category))]); renderDashboard(); applyFilters(); document.getElementById('loading').remove(); document.getElementById('dashboard').classList.remove('hide')}
function renderDashboard(){let g=group('priority'), total=DATA.length, hot=g['Hot Lead']||0, warm=g['Warm Lead']||0, follow=g['Follow-up Required']||0, not=g['Not Interested']||0; let opp=Math.round((hot*100+warm*70+follow*50)/(Math.max(total,1))); document.getElementById('kpis').innerHTML=[['Total Leads',total,'Unique inbound responders'],['Hot Leads',hot,'Call first'],['Warm Leads',warm,'Nurture + offer'],['Follow-up',follow,'Schedule callback'],['Opportunity Score',opp+'%','Weighted conversion opportunity']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${fmt(x[1])}</div><div class="hint">${x[2]}</div></div>`).join(''); charts.forEach(c=>c.destroy()); charts=[]; let p=group('priority'), c=Object.entries(group('campaign')).sort((a,b)=>b[1]-a[1]).slice(0,10); charts.push(new Chart(document.getElementById('priorityChart'),{type:'doughnut',data:{labels:Object.keys(p),datasets:[{data:Object.values(p)}]}})); charts.push(new Chart(document.getElementById('campaignChart'),{type:'bar',data:{labels:c.map(x=>x[0]),datasets:[{label:'Leads',data:c.map(x=>x[1])}]},options:{indexAxis:'y'}})); renderMini('topHotTable', DATA.filter(r=>r.priority==='Hot Lead').sort((a,b)=>b.score-a.score||b.response_count-a.response_count).slice(0,25)); document.getElementById('insights').innerHTML=`<b>Call Priority:</b> Start with Hot Leads showing price, fees, admission, payment, EMI, buy, join, or callback intent.<br><br><b>Recommended Action:</b> Assign Hot Leads to top counsellors today, Warm Leads to nurture campaigns, and Follow-up leads to scheduled callbacks.<br><br><b>Quality Note:</b> Not Interested / STOP / unsubscribe replies should be excluded from calling.`}
function applyFilters(){let q=document.getElementById('q').value.toLowerCase(), pr=priority.value, ca=campaign.value, cat=category.value, sig=signal.value.toLowerCase(), min=num(minScore.value), f=from.value, t=to.value; filtered=DATA.filter(r=>{let text=(r.phone+' '+r.latest_comment+' '+r.all_comments+' '+r.reason).toLowerCase(); return (!q||text.includes(q))&&(!pr||r.priority===pr)&&(!ca||r.campaign===ca)&&(!cat||r.category===cat)&&(!sig||text.includes(sig))&&(!min||r.score>=min)&&(!f||r.last_date>=f)&&(!t||r.last_date<=t)}); renderTable()}
function resetFilters(){['q','priority','campaign','category','from','to','signal','minScore'].forEach(id=>document.getElementById(id).value='');applyFilters()}
function sortBy(k){sortDir=sortKey===k?-sortDir:-1;sortKey=k;renderTable()} function sorted(){return filtered.slice().sort((a,b)=>{let A=a[sortKey],B=b[sortKey]; if(sortKey==='score'||sortKey==='response_count')return sortDir*(num(A)-num(B)); return sortDir*String(A).localeCompare(String(B))})}
function renderMini(id, arr){document.getElementById(id).innerHTML='<thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+arr.map(r=>'<tr>'+cols.map(c=>`<td>${c==='priority'?badge(r[c]):String(r[c]??'').slice(0,220)}</td>`).join('')+'</tr>').join('')+'</tbody>'}
function renderTable(){let limit=num(rows.value)||100, arr=sorted().slice(0,limit); resultText.textContent=`Showing ${fmt(arr.length)} of ${fmt(filtered.length)} filtered leads | Total database: ${fmt(DATA.length)}`; leadTable.innerHTML='<thead><tr>'+cols.map(c=>`<th onclick="sortBy('${c}')">${c} ↕</th>`).join('')+'</tr></thead><tbody>'+arr.map(r=>'<tr>'+cols.map(c=>`<td>${c==='priority'?badge(r[c]):String(r[c]??'').slice(0,350)}</td>`).join('')+'</tr>').join('')+'</tbody>'}
function downloadFilteredCSV(){let out=['phone,campaign,category,owner_number,first_date,last_date,response_count,latest_comment,all_comments,priority,score,reason']; filtered.forEach(r=>out.push(['phone','campaign','category','owner_number','first_date','last_date','response_count','latest_comment','all_comments','priority','score','reason'].map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out.join('\n')],{type:'text/csv'})); a.download='filtered_leads.csv'; a.click()}
fetch('data/leads.csv').then(r=>r.text()).then(t=>{DATA=parseCSV(t);init()}).catch(e=>{loading.innerHTML='Unable to load data/leads.csv. Use a local server or GitHub Pages, not direct file opening.'})
</script>
</body>
</html>
